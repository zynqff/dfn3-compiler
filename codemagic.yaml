workflows:
  compile-dfn3-coreml:
    name: Нативная сборка DFN3 в ONNX и MLMODELC
    instance_type: mac_mini_m2
    max_build_duration: 30

    scripts:
      - name: 1. Настройка Python 3.10 и установка Rust
        script: |
          echo "=== Переключение на Python 3.10 ==="
          pyenv global 3.10
          python3 --version
          
          echo "=== Установка Rust Toolchain ==="
          curl --proto '=https' --tlsv1.2 -sSf https://rustup.rs | sh -s -- -y
          source "$HOME/.cargo/env"
          cargo --version

      - name: 2. Подготовка окружения macOS (Зависимости)
        script: |
          echo "=== Инициализация окружения ==="
          pyenv global 3.10
          source "$HOME/.cargo/env"
          
          echo "=== Установка Python-пакетов ==="
          pip3 install --upgrade pip
          pip3 install torch torchvision torchaudio
          pip3 install onnx onnxruntime coremltools deepfilternet

      - name: 3. Скачивание исходного кода и весов DeepFilterNet3
        script: |
          echo "=== Скачивание репозитория для получения файлов конфигурации ==="
          curl -L https://github.com -o dfn.tar.gz
          tar -xzf dfn.tar.gz
          mv DeepFilterNet-0.5.6 deepfilternet_src

      - name: 4. Экспорт модели PyTorch в ONNX
        script: |
          echo "=== Инициализация окружения ==="
          pyenv global 3.10
          
          echo "=== Генерация ONNX файлов ==="
          mkdir -p output_onnx
          deep-filter export --model-base-dir deepfilternet_src/models/DeepFilterNet3 --output-dir output_onnx/

      - name: 5. Конвертация ONNX в Apple CoreML (.mlpackage)
        script: |
          echo "=== Инициализация окружения ==="
          pyenv global 3.10
          
          echo "=== Конвертация в формат Apple CoreML ==="
          mkdir -p output_coreml
          python3 -c "
          import coremltools as ct
          import os
          
          onnx_files = ['df_enc.onnx', 'df_erbn.onnx', 'df_dec.onnx']
          for f in onnx_files:
              onnx_path = os.path.join('output_onnx', f)
              if os.path.exists(onnx_path):
                  print(f'Конвертируем {f}...')
                  mlmodel = ct.converters.onnx.convert(model=onnx_path, minimum_ios_deployment_target='15.0')
                  mlmodel.save(os.path.join('output_coreml', f.replace('.onnx', '.mlpackage')))
          "

      - name: 6. Финальная компиляция на Mac в бинарный .mlmodelc
        script: |
          echo "=== Компиляция утилитой Xcode coremlcompiler ==="
          mkdir -p final_binaries
          
          xcrun coremlcompiler compile output_coreml/df_enc.mlpackage final_binaries/
          xcrun coremlcompiler compile output_coreml/df_erbn.mlpackage final_binaries/
          xcrun coremlcompiler compile output_coreml/df_dec.mlpackage final_binaries/
          
          echo "=== Сборка успешно завершена! ==="

    artifacts:
      - output_onnx/*.onnx
      - final_binaries/*
