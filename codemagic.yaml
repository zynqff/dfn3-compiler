workflows:
dfn3-coreml:
name: DFN3 ONNX to Core ML
instance_type: mac_mini_m2
max_build_duration: 120

environment:
  xcode: latest

scripts:

  - name: Install dependencies
    script: |
      set -e

      python3 -m venv .venv
      source .venv/bin/activate

      python -m pip install --upgrade pip

      pip install \
        numpy \
        scipy \
        onnx \
        onnxruntime \
        onnxsim \
        torch \
        coremltools

  - name: Download DeepFilterNet
    script: |
      set -e

      rm -rf DeepFilterNet

      git clone --depth 1 \
        https://github.com/Rikorose/DeepFilterNet.git \
        DeepFilterNet

      echo "DeepFilterNet downloaded."

      cd DeepFilterNet

      git rev-parse HEAD

      echo "Repository contents:"
      find . -maxdepth 2 -type f | sort

  - name: Download DFN3 model
    script: |
      set -e

      mkdir -p build

      curl -L \
        --fail \
        --retry 5 \
        --retry-all-errors \
        -o build/dfn3.tar.gz \
        https://github.com/Rikorose/DeepFilterNet/raw/main/models/DeepFilterNet3_onnx.tar.gz

      echo "Downloaded archive:"
      ls -lh build/dfn3.tar.gz

      mkdir -p build/model

      tar -xzf \
        build/dfn3.tar.gz \
        -C build/model

      echo "Extracted DFN3 files:"
      find build/model -type f | sort

  - name: Find ONNX models
    script: |
      set -e

      echo "Searching for ONNX files..."

      find build/model \
        -type f \
        -name "*.onnx" \
        -print

  - name: Prepare ONNX
    script: |
      set -e

      mkdir -p build/onnx

      find build/model \
        -type f \
        -name "enc.onnx" \
        -exec cp {} build/onnx/enc.onnx \;

      find build/model \
        -type f \
        -name "erb_dec.onnx" \
        -exec cp {} build/onnx/erb_dec.onnx \;

      find build/model \
        -type f \
        -name "df_dec.onnx" \
        -exec cp {} build/onnx/df_dec.onnx \;

      echo "Prepared files:"
      ls -lh build/onnx

      test -f build/onnx/enc.onnx
      test -f build/onnx/erb_dec.onnx
      test -f build/onnx/df_dec.onnx

  - name: Validate ONNX models
    script: |
      set -e

      source .venv/bin/activate

      python <<'PY'
      import onnx
      import glob

      files = glob.glob("build/onnx/*.onnx")

      print("Found ONNX models:", files)

      for path in files:
          print("")
          print("Checking:", path)

          model = onnx.load(path)
          onnx.checker.check_model(model)

          print("OK")
          print("Inputs:")

          for x in model.graph.input:
              print(" ", x.name)

          print("Outputs:")

          for x in model.graph.output:
              print(" ", x.name)
      PY

  - name: Create ONNX artifact
    script: |
      set -e

      mkdir -p build/output

      cp build/onnx/enc.onnx build/output/dfn3_enc.onnx
      cp build/onnx/erb_dec.onnx build/output/dfn3_erb_dec.onnx
      cp build/onnx/df_dec.onnx build/output/dfn3_df_dec.onnx

      echo "ONNX artifacts:"
      ls -lh build/output

  - name: Convert enc.onnx to Core ML
    script: |
      set -e

      source .venv/bin/activate

      python <<'PY'
      import coremltools as ct

      print("CoreMLTools:", ct.__version__)

      model = ct.converters.onnx.convert(
          model="build/onnx/enc.onnx"
      )

      model.save("build/output/dfn3_enc.mlmodel")

      print("Created dfn3_enc.mlmodel")
      PY

  - name: Compile Core ML
    script: |
      set -e

      mkdir -p build/compiled

      xcrun coremlcompiler compile \
        build/output/dfn3_enc.mlmodel \
        build/compiled

      echo "Compiled model:"
      find build/compiled -maxdepth 2 -print

  - name: Final verification
    script: |
      set -e

      echo "================================"
      echo "DFN3 BUILD"
      echo "================================"

      echo ""
      echo "ONNX:"
      ls -lh build/output/*.onnx

      echo ""
      echo "MLMODEL:"
      ls -lh build/output/*.mlmodel

      echo ""
      echo "MLMODELC:"
      find build/compiled -type d -name "*.mlmodelc" -print

      echo ""
      echo "================================"
      echo "SUCCESS"
      echo "================================"

artifacts:
  - build/output/*.onnx
  - build/output/*.mlmodel
  - build/compiled/**/*.mlmodelc/**
