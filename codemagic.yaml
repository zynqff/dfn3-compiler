workflows:
  dfn3-coreml:
    name: DFN3 → ONNX → Core ML
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      xcode: latest

    scripts:
      - name: Install Python dependencies
        script: |
          set -e

          python3 -m venv .venv
          source .venv/bin/activate

          python -m pip install --upgrade pip
          pip install -r requirements.txt

          # Если coremltools нет в requirements.txt:
          pip install coremltools

      - name: Export DFN3 to ONNX
        script: |
          set -e
          source .venv/bin/activate

          mkdir -p build

          python export_onnx.py \
            --output build/dfn3.onnx

          test -f build/dfn3.onnx

      - name: Convert ONNX to Core ML
        script: |
          set -e
          source .venv/bin/activate

          python <<'PY'
          import coremltools as ct

          print("Converting build/dfn3.onnx...")

          model = ct.converters.onnx.convert(
              model="build/dfn3.onnx"
          )

          model.save("build/dfn3.mlmodel")

          print("Created build/dfn3.mlmodel")
          PY

          test -f build/dfn3.mlmodel

      - name: Compile MLModel to MLModelC
        script: |
          set -e

          mkdir -p build/dfn3.mlmodelc

          xcrun coremlc compile \
            build/dfn3.mlmodel \
            build/

          test -d build/dfn3.mlmodelc

      - name: Verify artifacts
        script: |
          set -e

          echo "=== ONNX ==="
          ls -lh build/dfn3.onnx

          echo "=== MLModel ==="
          ls -lh build/dfn3.mlmodel

          echo "=== MLModelC ==="
          find build/dfn3.mlmodelc -maxdepth 2 -type f -print

    artifacts:
      - build/dfn3.onnx
      - build/dfn3.mlmodel
      - build/dfn3.mlmodelc/**
